name: Release msys2-argv-fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: 0.1.3

permissions:
  contents: write

concurrency: release-msys2-argv-fix

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test runtime
        run: python test.py
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases must run from main.' }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $env:VERSION" }

          $tag = "msys2-argv-fix-v$env:VERSION"
          $asset = 'dist/msys2-argv-fix.dll'
          gh release create $tag $asset --target $env:GITHUB_SHA --title "msys2-argv-fix $env:VERSION" --notes 'Preserves command-line arguments between native Windows and MSYS2 programs.'
